name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Typecheck & Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: digital-heroes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digital-heroes/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest tests
        run: npm run test
        env:
          ENC_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          LEDGER_SALT: test_ledger_salt_for_ci
          RAZORPAY_KEY_SECRET: test_razorpay_secret_ci
